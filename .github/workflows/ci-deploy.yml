name: Test and deploy field map

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: field-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s tests_v3 -p 'test_*.py'
      - name: Python compile check
        run: |
          python -m safety_dashboard.api.validate_data
          python -m compileall -q app.py safety_dashboard core
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: field_web/package-lock.json
      - name: React tests and build
        working-directory: field_web
        env:
          VITE_KAKAO_MAP_APP_KEY: test-build-key
        run: |
          npm ci
          npm test
          npm run build

  deploy-api:
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'safety-dashboard' }}
      SERVICE_NAME: safety-dashboard-api
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push API image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/api:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy API to Cloud Run Seoul
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account safety-dashboard-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 40 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars MONITORING_CACHE_SECONDS=300,CCTV_ENABLED=false,TZ=Asia/Seoul \
            --set-secrets KMA_API_KEY=KMA_API_KEY:1 \
            --quiet

  deploy-web:
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    needs: [test, deploy-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: field_web/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Build React field map
        working-directory: field_web
        env:
          VITE_KAKAO_MAP_APP_KEY: ${{ secrets.KAKAO_MAP_APP_KEY }}
          VITE_CCTV_ENABLED: "false"
        run: |
          npm ci
          npm run build
      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
