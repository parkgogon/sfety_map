name: Test and deploy field map

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: field-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s tests_v3 -p 'test_*.py'
      - name: Python compile check
        run: |
          python -m safety_dashboard.api.validate_data
          python -m compileall -q app.py safety_dashboard core
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: field_web/package-lock.json
      - name: React tests and build
        working-directory: field_web
        env:
          VITE_KAKAO_MAP_APP_KEY: test-build-key
        run: |
          npm ci
          npm test
          npm run build

  deploy-api:
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'safety-dashboard' }}
      SERVICE_NAME: safety-dashboard-api
      ALERT_AUTOMATION_ENABLED: ${{ vars.ALERT_AUTOMATION_ENABLED || 'false' }}
      ALERT_AUTOMATION_MODE: ${{ vars.ALERT_AUTOMATION_MODE || 'preview' }}
      ALERT_USER_DELIVERY_MODE: ${{ vars.ALERT_USER_DELIVERY_MODE || 'telegram' }}
      ALERT_INCLUDED_WARNING_TYPES: ${{ vars.ALERT_INCLUDED_WARNING_TYPES || '' }}
      ALERT_EXCLUDED_WARNING_TYPES: ${{ vars.ALERT_EXCLUDED_WARNING_TYPES || '열대야' }}
      TELEGRAM_ADMIN_SECRET_NAME: ${{ vars.TELEGRAM_ADMIN_SECRET_NAME || 'TELEGRAM_CHAT_ID' }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL || 'https://keco-safety-map.web.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push API image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/api:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy API to Cloud Run Seoul
        run: |-
          SECRET_BINDINGS="KMA_API_KEY=KMA_API_KEY:1,SOLAPI_WEBHOOK_SECRET=SOLAPI_WEBHOOK_SECRET:1,ADMIN_ACCESS_PASSWORD=ADMIN_ACCESS_PASSWORD:latest"
          if [[ "$ALERT_AUTOMATION_ENABLED" == "true" ]]; then
            SECRET_BINDINGS="$SECRET_BINDINGS,ALERT_ADMIN_TOKEN=ALERT_ADMIN_TOKEN:1,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:1,TELEGRAM_USER_CHAT_ID=TELEGRAM_USER_CHAT_ID:latest,TELEGRAM_ADMIN_CHAT_ID=$TELEGRAM_ADMIN_SECRET_NAME:latest"
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account safety-dashboard-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 40 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars MONITORING_CACHE_SECONDS=300,MONITORING_REFRESH_COOLDOWN_SECONDS=60,ADMIN_SESSION_SECONDS=28800,ADMIN_LOGIN_FAILURE_LIMIT=5,ADMIN_LOGIN_FAILURE_WINDOW_SECONDS=300,CCTV_ENABLED=false,TZ=Asia/Seoul,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,APP_REVISION=$GITHUB_SHA,ALERT_AUTOMATION_MODE=$ALERT_AUTOMATION_MODE,ALERT_USER_DELIVERY_MODE=$ALERT_USER_DELIVERY_MODE,ALERT_DAILY_CAP=100,ALERT_CAP_WARNING=80,ALERT_MONTHLY_CAP=500,ALERT_MONTHLY_CAP_WARNING=400,DASHBOARD_BASE_URL=$DASHBOARD_BASE_URL \
            --set-secrets "$SECRET_BINDINGS" \
            --quiet
      - name: Deploy private automatic alert worker
        if: env.ALERT_AUTOMATION_ENABLED == 'true'
        run: |-
          WORKER_SECRETS="KMA_API_KEY=KMA_API_KEY:1,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:1,TELEGRAM_USER_CHAT_ID=TELEGRAM_USER_CHAT_ID:latest,TELEGRAM_ADMIN_CHAT_ID=$TELEGRAM_ADMIN_SECRET_NAME:latest"
          if [[ "$ALERT_USER_DELIVERY_MODE" == "sms" ]]; then
            WORKER_SECRETS="$WORKER_SECRETS,SOLAPI_API_KEY=SOLAPI_API_KEY:1,SOLAPI_API_SECRET=SOLAPI_API_SECRET:1,SOLAPI_SENDER_NUMBER=SOLAPI_SENDER_NUMBER:1,CONTACT_SHEET_ID=CONTACT_SHEET_ID:1,ALERT_HMAC_SECRET=ALERT_HMAC_SECRET:1,ALERT_TEST_PHONE=ALERT_TEST_PHONE:1"
          fi
          gcloud run deploy safety-alert-worker \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account safety-dashboard-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 1 \
            --timeout 90 \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars APP_MODULE=safety_dashboard.alerts.worker_app:app,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,TZ=Asia/Seoul,APP_REVISION=$GITHUB_SHA,ALERT_AUTOMATION_MODE=$ALERT_AUTOMATION_MODE,ALERT_USER_DELIVERY_MODE=$ALERT_USER_DELIVERY_MODE,ALERT_INCLUDED_WARNING_TYPES=$ALERT_INCLUDED_WARNING_TYPES,ALERT_EXCLUDED_WARNING_TYPES=$ALERT_EXCLUDED_WARNING_TYPES,ALERT_DAILY_CAP=100,ALERT_CAP_WARNING=80,ALERT_MONTHLY_CAP=500,ALERT_MONTHLY_CAP_WARNING=400,SOLAPI_BALANCE_WARNING=10000,SOLAPI_BALANCE_CRITICAL=3000,ALERT_PENDING_SECONDS=1800,ALERT_TELEGRAM_RETRY_SECONDS=1800,CONTACT_SHEET_RANGE=Recipients!A:E,DASHBOARD_BASE_URL=$DASHBOARD_BASE_URL \
            --set-secrets "$WORKER_SECRETS" \
            --quiet
      - name: Configure five-minute alert schedule
        if: env.ALERT_AUTOMATION_ENABLED == 'true'
        run: |-
          SCHEDULER_ACCOUNT="safety-alert-scheduler@$GCP_PROJECT_ID.iam.gserviceaccount.com"
          WORKER_URL="$(gcloud run services describe safety-alert-worker --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          gcloud run services add-iam-policy-binding safety-alert-worker \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --member="serviceAccount:$SCHEDULER_ACCOUNT" \
            --role="roles/run.invoker" \
            --quiet
          if gcloud scheduler jobs describe safety-alert-dispatch --project "$GCP_PROJECT_ID" --location "$GCP_REGION" >/dev/null 2>&1; then
            ACTION=update
          else
            ACTION=create
          fi
          gcloud scheduler jobs "$ACTION" http safety-alert-dispatch \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --schedule="*/5 * * * *" \
            --time-zone="Asia/Seoul" \
            --uri="$WORKER_URL/internal/v1/dispatch" \
            --http-method=POST \
            --oidc-service-account-email="$SCHEDULER_ACCOUNT" \
            --oidc-token-audience="$WORKER_URL" \
            --attempt-deadline=90s \
            --quiet

  deploy-web:
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    needs: [test, deploy-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: field_web/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Build React field map
        working-directory: field_web
        env:
          VITE_KAKAO_MAP_APP_KEY: ${{ secrets.KAKAO_MAP_APP_KEY }}
          VITE_CCTV_ENABLED: "false"
        run: |
          npm ci
          npm run build
      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
