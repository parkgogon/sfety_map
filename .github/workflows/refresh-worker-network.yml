name: Refresh worker network

on:
  workflow_dispatch:
    inputs:
      expected_worker_revision:
        description: Current expected worker revision (abort if changed)
        type: string
        required: true
      expected_app_revision:
        description: Deployed app SHA (image and APP_REVISION must match)
        type: string
        required: true

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_WORKER_REVISION: ${{ inputs.expected_worker_revision }}
      EXPECTED_APP_REVISION: ${{ inputs.expected_app_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: python3 scripts/refresh_worker_network.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-network-refresh
          path: release-check/
          retention-days: 14
